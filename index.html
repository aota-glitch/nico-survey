<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>満足度アンケート</title>
    <style>
        /* リセットと基本設定 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", YuGothic, Arial, sans-serif;
            background-color: #f5f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h2 {
            margin: 0 0 25px 0;
            font-size: 1.2rem;
            color: #333;
            text-align: center;
            line-height: 1.4;
        }
        /* ボタンを縦に並べるコンテナ */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 400px; /* スマホで見やすい最大幅 */
        }
        /* 横長のボタンデザイン */
        .btn {
            display: flex;
            align-items: center; /* 垂直中央揃え */
            /* justify-content: flex-start; */
            background: white;
            border: 2px solid #eee;
            border-radius: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        /* タップ時のエフェクト */
        .btn:active {
            background-color: #eefbee; /* 薄い緑 */
            border-color: #06c755;
            transform: scale(0.99);
        }
        /* 左側の大きな数字 */
        .num {
            font-size: 1.6rem;
            font-weight: bold;
            color: #06c755;
            margin-right: 20px;
            min-width: 40px; /* 幅を揃える */
            text-align: center;
        }
        /* 右側のテキストラベル */
        .label {
            font-size: 1rem;
            color: #555;
            font-weight: 500;
        }
        /* 特に重要な項目の強調（オプション） */
        .btn.high-score .label { color: #06c755; }
        .btn.low-score .label { color: #e64a19; }

    </style>
</head>
<body>
    <h2>本日の診療はいかがでしたか？<br>満足度を教えてください。</h2>
    
    <div class="list-container" id="list"></div>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // ==========================================
        // ★ここにあなたの公式LINEのIDを入れてください（@も含める）
        // ==========================================
        const LINE_ID = "@047sjzak"; 

        // 点数ごとのラベル
        const scoreLabels = {
            10: "非常に満足", 9: "満足", 8: "良かった", 7: "まあまあ良かった",
            6: "普通", 5: "どちらでもない", 4: "少し物足りない",
            3: "不満がある", 2: "残念だった", 1: "非常に不満"
        };

        const listContainer = document.getElementById('list');

        // ボタン生成処理
        for (let i = 10; i >= 1; i--) {
            const btn = document.createElement('div');
            btn.className = 'btn';
            if (i >= 9) btn.classList.add('high-score');
            if (i <= 2) btn.classList.add('low-score');
            
            // ★ここが変更点：クリック時の挙動
            btn.onclick = () => send(i);

            const numSpan = document.createElement('span');
            numSpan.className = 'num';
            numSpan.innerText = i;
            const labelSpan = document.createElement('span');
            labelSpan.className = 'label';
            labelSpan.innerText = scoreLabels[i] || '';
            btn.appendChild(numSpan);
            btn.appendChild(labelSpan);
            listContainer.appendChild(btn);
        }

        // LIFF初期化（ウィンドウを閉じる機能などのために一応入れておく）
        const MY_LIFF_ID = "YOUR_LIFF_ID_HERE"; // そのままでOK
        liff.init({ liffId: MY_LIFF_ID }).catch(err => console.error(err));

        // ★送信処理（ここが大きく変わります）
        function send(score) {
            const label = scoreLabels[score] || '';
            const messageText = `満足度アンケート回答：\n【${score}】${label}`;
            
            // メッセージをエンコード（URLで使える文字に変換）
            const encodedText = encodeURIComponent(messageText);
            
            // LINEのトーク画面を開き、文字を入力欄に入れるURL
            const url = `https://line.me/R/oaMessage/${LINE_ID}/?${encodedText}`;
            
            // ページ遷移（これでトーク画面に戻ります）
            location.href = url;
        }
    </script>
</body>
</html>
